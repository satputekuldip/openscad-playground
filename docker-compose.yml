services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-ochafik}/openscad-playground:latest
    ports:
      - "3000:80"
    restart: unless-stopped

  # Build-only service for development or manual builds
  builder:
    image: node:20-alpine
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: /bin/sh
    command: -c "apk add --no-cache git zip wget curl ca-certificates && npm install && npm run build:all"
